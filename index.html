<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7d2b57">
<title>NUR243 Respiratory NCLEX Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Pacifico&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --accent:#b0417a;
    --accent-dark:#7d2b57;
    --accent-soft:#f6e2ee;
    --accent-softer:#fbf1f7;
    --ink:#211722;
    --ink-soft:#5a4a56;
    --line:#e7d7e2;
    --good:#1f8a4c;
    --good-bg:#e3f6ea;
    --good-line:#9fdcb6;
    --bad:#c62839;
    --bad-bg:#fdeaec;
    --bad-line:#f2b6bd;
    --card:#ffffff;
    --shadow:0 18px 46px rgba(50,20,45,.34);
    --radius:20px;
  }
  /* Force light rendering even if the device is in dark mode */
  :root:not([data-theme="light"]),
  :root[data-theme="dark"]{ color-scheme: light; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:var(--ink);
    min-height:100vh;
    background-color:#5b2f52;
    /* If you add a file named background.jpg next to index.html it becomes the
       full-screen fixed backdrop. Until then, the plum gradient below shows. */
    background-image:
      linear-gradient(160deg, rgba(60,28,58,.55), rgba(120,43,87,.45) 55%, rgba(201,111,155,.40)),
      url('background.jpg'),
      linear-gradient(160deg, #47264a 0%, #7d2b57 52%, #c96f9b 100%);
    background-repeat:no-repeat;
    background-size:cover, cover, cover;
    background-position:center center;
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:660px;
    margin:0 auto;
    padding:22px 16px calc(96px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .card{
    background:var(--card);
    color:var(--ink);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 20px;
    margin-bottom:16px;
  }
  /* ---- Landing ---- */
  .brand{ text-align:center; padding-top:6px; }
  .brand .script{
    font-family:'Pacifico', cursive;
    color:var(--accent);
    font-size:26px;
    line-height:1;
    margin:0 0 2px;
    text-shadow:0 1px 0 #fff;
  }
  .brand h1{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:700;
    font-size:30px;
    line-height:1.05;
    margin:2px 0 6px;
    color:var(--ink);
  }
  .brand .sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
    font-weight:600;
    letter-spacing:.3px;
  }
  .section-label{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:1.4px;
    font-size:13px;
    font-weight:600;
    color:var(--accent-dark);
    margin:2px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-label .step{
    background:var(--accent);
    color:#fff;
    width:22px; height:22px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
    font-family:'Nunito Sans',sans-serif;
    flex:0 0 auto;
  }
  .subject-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button{ font-family:inherit; }
  .btn{
    -webkit-appearance:none; appearance:none;
    border:none; cursor:pointer;
    border-radius:14px;
    min-height:52px;
    padding:12px 16px;
    font-size:16px;
    font-weight:700;
    color:#fff;
    background:var(--accent);
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
    touch-action:manipulation;
    transition:transform .05s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 6px 16px rgba(176,65,122,.28);
    text-align:center;
    line-height:1.2;
  }
  .btn:active{ transform:scale(.975); }
  .btn.ghost{
    background:#fff; color:var(--accent-dark);
    border:2px solid var(--accent);
    box-shadow:none;
  }
  .btn.soft{
    background:var(--accent-soft); color:var(--accent-dark);
    box-shadow:none;
  }
  .btn.dark{ background:var(--accent-dark); }
  .btn.block{ margin-top:10px; }
  .subject-btn{
    flex-direction:column; gap:4px; min-height:74px;
    background:linear-gradient(150deg,var(--accent),var(--accent-dark));
  }
  .subject-btn.selected{
    outline:3px solid var(--accent-dark);
    outline-offset:2px;
  }
  .subject-btn .em{ font-size:20px; }
  .subject-btn small{ font-weight:600; opacity:.9; font-size:11.5px; }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin:10px 2px 0; line-height:1.45; }

  /* ---- Mode toggle ---- */
  .toggle{
    display:flex; background:var(--accent-softer);
    border-radius:14px; padding:5px; gap:5px;
    border:1px solid var(--line);
  }
  .toggle button{
    flex:1; border:none; background:transparent; cursor:pointer;
    padding:12px 8px; border-radius:10px; font-size:15px; font-weight:700;
    color:var(--ink-soft); min-height:48px; touch-action:manipulation;
  }
  .toggle button.on{ background:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(176,65,122,.3); }
  .mode-desc{ font-size:12.5px; color:var(--ink-soft); margin:10px 2px 0; line-height:1.45; min-height:34px; }

  .version-row{ display:flex; flex-direction:column; gap:10px; }
  .disabled-note{ opacity:.55; pointer-events:none; }

  /* ---- Recent scores ---- */
  .scores-head{ display:flex; align-items:center; justify-content:space-between; }
  .scores-table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  .scores-table th{
    text-align:left; font-family:'Oswald',sans-serif; text-transform:uppercase;
    letter-spacing:.6px; font-size:11px; color:var(--accent-dark);
    border-bottom:2px solid var(--line); padding:6px 6px;
  }
  .scores-table td{ padding:7px 6px; border-bottom:1px solid var(--line); color:var(--ink); }
  .scores-table .sc{ font-weight:800; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .pill.study{ background:var(--accent-soft); color:var(--accent-dark); }
  .pill.exam{ background:#efe6f5; color:#6a2b8a; }
  .empty{ color:var(--ink-soft); font-size:13.5px; padding:10px 2px; }
  .linkbtn{
    background:none; border:none; color:var(--accent); font-weight:700;
    cursor:pointer; font-size:13px; padding:6px 4px; touch-action:manipulation;
  }

  /* ---- Quiz ---- */
  .quiz-top{ position:sticky; top:0; z-index:5; }
  .qbar{
    background:#fff; border-radius:16px; box-shadow:var(--shadow);
    padding:12px 14px; margin-bottom:14px;
  }
  .qbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .qmeta{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.7px; font-size:12px; color:var(--accent-dark); font-weight:600; }
  .timer{
    font-weight:800; font-variant-numeric:tabular-nums; font-size:16px;
    color:var(--accent-dark); background:var(--accent-soft);
    padding:4px 10px; border-radius:999px; min-width:64px; text-align:center;
  }
  .timer.warn{ color:#fff; background:var(--bad); animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{ opacity:.65; } }
  .bubbles{ display:flex; flex-wrap:wrap; gap:6px; }
  .bub{
    width:15px; height:15px; border-radius:50%;
    background:#e7d7e2; border:2px solid #e7d7e2;
    flex:0 0 auto; transition:all .15s ease;
  }
  .bub.done{ background:var(--accent); border-color:var(--accent); }
  .bub.cur{ border-color:var(--accent-dark); background:#fff; box-shadow:0 0 0 2px var(--accent-soft); }
  .bub.correct{ background:var(--good); border-color:var(--good); }
  .bub.wrong{ background:var(--bad); border-color:var(--bad); }

  .cat-tag{
    display:inline-block; background:var(--accent-soft); color:var(--accent-dark);
    font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px;
    margin-bottom:10px; letter-spacing:.3px;
  }
  .sata-tag{ background:#efe6f5; color:#6a2b8a; margin-left:6px; }
  .stem{ font-size:18px; line-height:1.4; font-weight:700; margin:0 0 16px; color:var(--ink); }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    display:flex; align-items:flex-start; gap:11px;
    border:2px solid var(--line); background:#fff;
    border-radius:14px; padding:13px 14px; cursor:pointer;
    font-size:15.5px; line-height:1.35; color:var(--ink);
    touch-action:manipulation; text-align:left; width:100%;
    -webkit-appearance:none; appearance:none;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt:active{ transform:scale(.995); }
  .opt .box{
    flex:0 0 auto; width:24px; height:24px; border-radius:7px;
    border:2px solid var(--accent); display:flex; align-items:center; justify-content:center;
    font-weight:800; color:var(--accent); font-size:13px; margin-top:1px; background:#fff;
  }
  .opt.sata .box{ border-radius:7px; }
  .opt.single .box{ border-radius:50%; }
  .opt.sel{ border-color:var(--accent); background:var(--accent-softer); }
  .opt.sel .box{ background:var(--accent); color:#fff; }
  .opt.correct{ border-color:var(--good); background:var(--good-bg); }
  .opt.correct .box{ background:var(--good); border-color:var(--good); color:#fff; }
  .opt.wrong{ border-color:var(--bad); background:var(--bad-bg); }
  .opt.wrong .box{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .opt.missed{ border-color:var(--good); background:#fff; }
  .opt.missed .box{ border-color:var(--good); color:var(--good); }

  .feedback{ margin-top:14px; border-radius:14px; padding:14px; font-size:14.5px; line-height:1.5; }
  .feedback.ok{ background:var(--good-bg); border:1px solid var(--good-line); }
  .feedback.no{ background:var(--bad-bg); border:1px solid var(--bad-line); }
  .feedback .verdict{ font-weight:800; font-size:15px; margin-bottom:6px; display:flex; align-items:center; gap:7px; }
  .feedback .lbl{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.6px; font-size:11.5px; color:var(--accent-dark); margin:9px 0 2px; font-weight:600; }
  .feedback .mn{ background:#fff; border-left:4px solid var(--accent); padding:8px 11px; border-radius:8px; font-style:italic; }

  .qactions{ margin-top:16px; display:flex; gap:10px; }
  .qactions .btn{ flex:1; }

  /* ---- Results ---- */
  .score-hero{ text-align:center; padding:6px 0 4px; }
  .score-ring{
    width:132px; height:132px; border-radius:50%; margin:6px auto 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; box-shadow:0 10px 26px rgba(120,43,87,.4);
  }
  .score-ring .pct{ font-family:'Oswald',sans-serif; font-size:38px; font-weight:700; line-height:1; }
  .score-ring .frac{ font-size:13px; font-weight:700; opacity:.95; margin-top:3px; }
  .score-sub{ font-size:14px; color:var(--ink-soft); font-weight:600; }
  .breakdown{ margin-top:6px; }
  .bd-row{ margin:10px 0; }
  .bd-row .bd-top{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; margin-bottom:4px; }
  .bd-row .bd-top .n{ color:var(--ink-soft); font-weight:700; }
  .bar{ height:10px; background:var(--accent-softer); border-radius:999px; overflow:hidden; }
  .bar > span{ display:block; height:100%; background:var(--accent); border-radius:999px; }
  .bar > span.low{ background:var(--bad); }
  .bar > span.mid{ background:#e0932f; }
  .bar > span.high{ background:var(--good); }
  .weak-list{ list-style:none; margin:8px 0 0; padding:0; }
  .weak-list li{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; gap:10px; }
  .weak-list li .wl{ font-weight:700; }
  .weak-list li .wc{ background:var(--bad-bg); color:var(--bad); font-weight:800; border-radius:999px; padding:2px 10px; font-size:12.5px; flex:0 0 auto; }
  .review-item{ border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .review-q{ padding:12px 13px; cursor:pointer; display:flex; gap:10px; align-items:flex-start; touch-action:manipulation; background:#fff; }
  .review-q .mark{ flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; }
  .review-q .mark.ok{ background:var(--good); }
  .review-q .mark.no{ background:var(--bad); }
  .review-q .rq-text{ font-size:14px; font-weight:700; line-height:1.35; }
  .review-q .chev{ margin-left:auto; color:var(--accent); font-weight:800; flex:0 0 auto; }
  .review-body{ padding:0 13px 13px; font-size:13.5px; line-height:1.5; display:none; }
  .review-item.open .review-body{ display:block; }
  .review-body .ra{ margin:8px 0 3px; }
  .review-body .ra b{ color:var(--accent-dark); }
  .review-body .mn{ background:var(--accent-softer); border-left:4px solid var(--accent); padding:8px 11px; border-radius:8px; font-style:italic; margin-top:8px; }
  .results-actions{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }

  /* ---- Calculator (pinned) ---- */
  .calc-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--accent-dark);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(40,15,35,.3);
  }
  .calc-bar button{
    width:100%; border:none; background:rgba(255,255,255,.16); color:#fff;
    font-weight:800; font-size:15px; padding:12px; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px;
    touch-action:manipulation; font-family:inherit;
  }
  .calc-panel{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#fff; border-top-left-radius:22px; border-top-right-radius:22px;
    box-shadow:0 -12px 34px rgba(40,15,35,.4);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(110%); transition:transform .22s ease;
    max-width:660px; margin:0 auto;
  }
  .calc-panel.open{ transform:translateY(0); }
  .calc-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .calc-head .t{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-weight:600; color:var(--accent-dark); }
  .calc-close{ background:var(--accent-soft); border:none; color:var(--accent-dark); font-weight:800; border-radius:10px; padding:8px 14px; cursor:pointer; touch-action:manipulation; min-height:40px; }
  .calc-display{
    background:var(--accent-softer); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; text-align:right; margin-bottom:10px;
  }
  .calc-display .expr{ font-size:13px; color:var(--ink-soft); min-height:16px; font-variant-numeric:tabular-nums; }
  .calc-display .cur{ font-size:30px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.1; word-break:break-all; }
  .calc-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .calc-grid button{
    border:none; border-radius:13px; padding:16px 0; font-size:20px; font-weight:800;
    cursor:pointer; background:var(--accent-softer); color:var(--ink);
    touch-action:manipulation; min-height:56px; font-family:inherit;
  }
  .calc-grid button:active{ transform:scale(.96); }
  .calc-grid button.op{ background:var(--accent-soft); color:var(--accent-dark); }
  .calc-grid button.eq{ background:var(--accent); color:#fff; }
  .calc-grid button.fn{ background:#efe6f5; color:#6a2b8a; }
  .backdrop{ position:fixed; inset:0; background:rgba(30,12,28,.45); z-index:45; display:none; }
  .backdrop.open{ display:block; }

  .topbar{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .topbar .back{ background:rgba(255,255,255,.9); border:none; color:var(--accent-dark); font-weight:800; border-radius:10px; padding:8px 12px; cursor:pointer; touch-action:manipulation; min-height:40px; font-size:14px; }
  .footer-note{ text-align:center; color:rgba(255,255,255,.9); font-size:12px; padding:6px 10px 2px; line-height:1.5; text-shadow:0 1px 2px rgba(0,0,0,.3); }
  @media (max-width:360px){ .subject-grid{ grid-template-columns:1fr; } .brand h1{ font-size:26px; } }

  /* ---- AI Tutor (Claude) ---- */
  .tutor-fab{
    position:fixed; right:16px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:42;
    border:none; border-radius:999px; padding:12px 18px; min-height:48px;
    background:#fff; color:var(--accent-dark); font-family:inherit; font-weight:800; font-size:15px;
    box-shadow:0 10px 26px rgba(40,15,35,.38); cursor:pointer; touch-action:manipulation;
    display:flex; align-items:center; gap:8px;
  }
  .tutor-fab:active{ transform:scale(.96); }
  body:has(#calc-bar) .tutor-fab{ bottom:calc(84px + env(safe-area-inset-bottom)); }
  body[data-tutor="off"] .tutor-fab{ display:none; }
  .tutor-backdrop{ position:fixed; inset:0; background:rgba(30,12,28,.5); z-index:60; display:none; }
  .tutor-backdrop.open{ display:block; }
  .tutor-panel{
    position:fixed; left:0; right:0; bottom:0; z-index:61;
    height:min(88vh, 88dvh); max-width:660px; margin:0 auto;
    background:#fff; color:var(--ink);
    border-top-left-radius:22px; border-top-right-radius:22px;
    box-shadow:0 -12px 34px rgba(40,15,35,.4);
    display:flex; flex-direction:column;
    transform:translateY(110%); transition:transform .22s ease;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tutor-panel.open{ transform:translateY(0); }
  .tutor-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  .tutor-head .t{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-weight:600; color:var(--accent-dark); font-size:17px; display:block; }
  .tutor-head small{ color:var(--ink-soft); font-size:12px; }
  .tutor-head-btns{ display:flex; gap:6px; }
  .tutor-head-btns button{ background:var(--accent-soft); border:none; color:var(--accent-dark); font-weight:800; border-radius:10px; padding:8px 11px; cursor:pointer; touch-action:manipulation; min-height:40px; font-family:inherit; font-size:13.5px; }
  .tutor-settings{ padding:14px 16px; background:var(--accent-softer); border-bottom:1px solid var(--line); font-size:14px; line-height:1.45; }
  .tutor-settings[hidden]{ display:none; }
  .tutor-settings .msg{ font-weight:800; color:var(--accent-dark); margin:0 0 6px; }
  .tutor-settings label{ font-weight:700; display:block; margin-bottom:6px; }
  .tutor-settings input{ width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-family:inherit; background:#fff; color:var(--ink); }
  .tutor-settings .row{ display:flex; gap:8px; margin-top:10px; }
  .tutor-settings .row .btn{ min-height:44px; font-size:15px; }
  .tutor-settings p{ margin:10px 0 0; color:var(--ink-soft); font-size:12.5px; }
  .tutor-settings a{ color:var(--accent-dark); font-weight:700; }
  .tutor-log{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .tmsg{ max-width:92%; padding:10px 13px; border-radius:16px; font-size:15px; line-height:1.5; overflow-wrap:anywhere; }
  .tmsg.user{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; white-space:pre-wrap; }
  .tmsg.bot{ align-self:flex-start; background:var(--accent-softer); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .tmsg.bot p{ margin:0 0 8px; } .tmsg.bot p:last-child{ margin-bottom:0; }
  .tmsg.bot ul, .tmsg.bot ol{ margin:4px 0 8px; padding-left:20px; }
  .tmsg.bot li{ margin:2px 0; }
  .tmsg.bot h4{ margin:8px 0 4px; font-size:15px; color:var(--accent-dark); }
  .tmsg.bot code{ background:#fff; border:1px solid var(--line); border-radius:5px; padding:0 4px; font-size:13.5px; }
  .tmsg.bot hr{ border:none; border-top:1px solid var(--line); margin:8px 0; }
  .tmsg.err{ align-self:stretch; max-width:none; background:var(--bad-bg); border:1px solid var(--bad-line); color:var(--bad); font-weight:700; font-size:14px; }

  .typing{ display:inline-flex; gap:4px; padding:4px 0; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.35; animation:tblink 1.1s infinite; }
  .typing span:nth-child(2){ animation-delay:.18s; } .typing span:nth-child(3){ animation-delay:.36s; }
  @keyframes tblink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }
  .tutor-chips{ display:flex; gap:7px; overflow-x:auto; padding:8px 16px 2px; scrollbar-width:none; }
  .tutor-chips::-webkit-scrollbar{ display:none; }
  .tutor-chips button{ flex:none; border:1px solid var(--accent); background:#fff; color:var(--accent-dark); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; touch-action:manipulation; }
  .tutor-form{ display:flex; gap:8px; align-items:flex-end; padding:8px 16px 6px; }
  .tutor-form textarea{ flex:1; resize:none; font-family:inherit; font-size:16px; line-height:1.35; padding:11px 12px; border:1px solid var(--line); border-radius:14px; max-height:130px; background:#fff; color:var(--ink); }
  .tutor-form textarea:focus{ outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .tutor-send{ border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:800; font-size:15px; padding:0 16px; min-height:46px; cursor:pointer; font-family:inherit; touch-action:manipulation; }
  .tutor-send.stop{ background:var(--accent-dark); }
  .tutor-disclaimer{ margin:0; padding:0 16px 8px; font-size:11.5px; color:var(--ink-soft); text-align:center; }
  .btn.tutor-ask{ margin-top:12px; min-height:46px; font-size:15px; }

<script>
/* NUR243 Respiratory - PNEUMONIA question bank
   30 concepts, three parallel versions (A/B/C).
   Same concept order + same type per index across versions.
   answer = 0-based indices into options. */
window.QBANK = window.QBANK || {};
window.QBANK.pneumonia = {
  name: "Pneumonia",
  versions: {
    A: [
      { cid:"pna-01", cat:"Overview", type:"single",
        stem:"A nursing student asks how significant pneumonia is as a health problem. Which statement by the nurse is most accurate?",
        options:[
          "Pneumonia is an acute infection of the lung parenchyma and, with lower respiratory infections, was a leading cause of death worldwide",
          "Pneumonia is a chronic inflammatory condition that rarely causes death",
          "Pneumonia only affects the upper airway and resolves without treatment",
          "Pneumonia is a viral illness that never requires hospitalization"],
        answer:[0],
        rationale:"Pneumonia is an acute infection of the lung parenchyma and, together with lower respiratory tract infections, ranked among the leading causes of death worldwide. It is not confined to the upper airway, is not always viral, and can be life-threatening.",
        mnemonic:"PARENCHYMA = 'Parenchyma Attacked, Really Extensive Notable Cause of death, Hits Your Multiple Alveoli.'" },

      { cid:"pna-02", cat:"Pathophysiology", type:"single",
        stem:"A patient develops pneumonia after inhaling airborne microbes at a crowded event. Which route of organism entry does this represent?",
        options:[
          "Inhalation of microbes present in the air",
          "Aspiration of normal flora from the naso/oropharynx",
          "Hematogenous spread from a primary infection elsewhere",
          "Direct extension from the pleural space"],
        answer:[0],
        rationale:"Organisms reach the lungs three ways: aspiration of normal flora, inhalation of airborne microbes, and hematogenous spread from another site. Breathing in microbes at a crowded event is inhalation. There is no 'direct extension from the pleura' route in this classification.",
        mnemonic:"3 roads to the lung: 'AIH' = Aspiration, Inhalation, Hematogenous." },

      { cid:"pna-03", cat:"Pathophysiology", type:"single",
        stem:"The nurse is teaching about how the lungs normally protect themselves. Which is a normal pulmonary defense mechanism?",
        options:[
          "The mucociliary escalator moving trapped debris upward",
          "Bronchoconstriction that permanently narrows the airway",
          "Suppression of the cough reflex during sleep",
          "Loss of alveolar macrophages with aging"],
        answer:[0],
        rationale:"Normal defenses include air filtration, epiglottic closure, the cough reflex, the mucociliary escalator, reflex bronchoconstriction, and immune cells (IgA, IgG, alveolar macrophages). Loss of macrophages and a suppressed cough impair defenses; they are not normal protective mechanisms.",
        mnemonic:"Escalator UP = mucus and microbes ride OUT." },

      { cid:"pna-04", cat:"Risk Factors", type:"sata",
        stem:"A nurse identifies factors that overwhelm or impair the lungs' normal defenses. Select all that apply.",
        options:[
          "Cigarette smoking",
          "Tracheal intubation",
          "Advancing age",
          "Regular aerobic exercise",
          "A recent viral upper respiratory infection",
          "Adequate hydration"],
        answer:[0,1,2,4],
        rationale:"Smoking, intubation, aging, air pollution, chronic disease, and a recent viral URI all impair or overwhelm normal defenses. Regular exercise and adequate hydration support (not impair) pulmonary defense.",
        mnemonic:"Defenses drop with 'SITA-V': Smoking, Intubation, Toxins/pollution, Age, Viral URI." },

      { cid:"pna-05", cat:"Classification", type:"single",
        stem:"A patient who has not been hospitalized or in long-term care recently develops pneumonia at home. How is this classified?",
        options:[
          "Community-acquired pneumonia (CAP)",
          "Hospital-acquired pneumonia (HAP)",
          "Ventilator-associated pneumonia (VAP)",
          "Nosocomial pneumonia"],
        answer:[0],
        rationale:"CAP is an acute infection in a patient who has NOT been hospitalized or lived in long-term care within 14 days of symptom onset. HAP/VAP/nosocomial pneumonia are all hospital-associated.",
        mnemonic:"CAP = Caught At Public/home place." },

      { cid:"pna-06", cat:"Classification", type:"single",
        stem:"A patient admitted 3 days ago for a hip fracture now has a new lung infection that was not present on admission. This is best classified as:",
        options:[
          "Hospital-acquired pneumonia (HAP)",
          "Community-acquired pneumonia (CAP)",
          "Aspiration pneumonia",
          "Opportunistic pneumonia"],
        answer:[0],
        rationale:"HAP occurs 48 hours or longer after hospitalization and was not present at admission. This patient developed it on day 3 (72 hours), so it is HAP, not CAP.",
        mnemonic:"HAP = Hospital, After 48+ hrs, not Present at admission." },

      { cid:"pna-07", cat:"Classification", type:"single",
        stem:"A mechanically ventilated ICU patient develops pneumonia 72 hours after endotracheal intubation. This is:",
        options:[
          "Ventilator-associated pneumonia (VAP)",
          "Community-acquired pneumonia (CAP)",
          "Aspiration pneumonia",
          "Necrotizing pneumonia"],
        answer:[0],
        rationale:"VAP occurs more than 48 hours after endotracheal intubation. Onset at 72 hours post-intubation meets this definition. It is a subtype of hospital-associated pneumonia.",
        mnemonic:"VAP = Ventilator, After 48, Post-tube." },

      { cid:"pna-08", cat:"Types", type:"single",
        stem:"A patient with a depressed gag reflex after a stroke inhales gastric contents. Which type of pneumonia is the greatest concern?",
        options:[
          "Aspiration pneumonia",
          "Mycoplasma (atypical) pneumonia",
          "Viral pneumonia",
          "Community-acquired pneumonia in a healthy adult"],
        answer:[0],
        rationale:"Aspiration pneumonia results from abnormal entry of oral or gastric material into the lower airway; a depressed gag/cough reflex, decreased LOC, and difficulty swallowing are major risk factors. Aspirated acidic contents first cause chemical pneumonitis, with possible bacterial infection in 24-72 hours.",
        mnemonic:"Aspiration risk = 'GAG gone' (Gag/cough down, Altered LOC, Gastric/oral material in)." },

      { cid:"pna-09", cat:"Risk Factors", type:"sata",
        stem:"Which findings place a patient at increased risk for aspiration pneumonia? Select all that apply.",
        options:[
          "Decreased level of consciousness",
          "Presence of a nasogastric tube with tube feeding",
          "Difficulty swallowing",
          "Intact, brisk gag reflex",
          "Depressed cough reflex",
          "Fully alert and ambulatory status"],
        answer:[0,1,2,4],
        rationale:"Decreased LOC, NG tube feeding, dysphagia, and a depressed cough or gag reflex all promote aspiration. An intact gag reflex and full alertness are protective, not risk factors.",
        mnemonic:"Aspirate when you can't 'SWALLOW': Sedated/decreased LOC, Weak cough, Attached tube feeds, Loss of gag, Low swallow ability." },

      { cid:"pna-10", cat:"Types", type:"single",
        stem:"A patient with HIV and a low CD4 count develops a slow-onset pneumonia with nonproductive cough and hypoxemia; CXR shows diffuse bilateral infiltrates. The nurse suspects:",
        options:[
          "Pneumocystis jiroveci pneumonia (PJP)",
          "Bacterial lobar pneumonia",
          "Mycoplasma pneumonia",
          "Aspiration pneumonia"],
        answer:[0],
        rationale:"PJP is a fungal opportunistic infection most common in HIV/immunocompromised patients. It has a slow, subtle onset with fever, tachypnea, dyspnea, nonproductive cough, and hypoxemia, and CXR shows diffuse bilateral infiltrates.",
        mnemonic:"PJP = 'Poor Jaded (immune) Person' - opportunistic, HIV, dry cough, diffuse CXR." },

      { cid:"pna-11", cat:"Treatment", type:"single",
        stem:"Which medication is the treatment of choice for Pneumocystis jiroveci pneumonia (PJP)?",
        options:[
          "Trimethoprim/sulfamethoxazole",
          "An inhaled antifungal only",
          "Isoniazid",
          "Standard antifungal therapy, to which PJP reliably responds"],
        answer:[0],
        rationale:"PJP is treated with trimethoprim/sulfamethoxazole. Despite being a fungal organism, PJP does NOT respond to typical antifungals. Isoniazid treats TB, not PJP.",
        mnemonic:"PJP → 'TMP-SMX', not antifungals." },

      { cid:"pna-12", cat:"Types", type:"single",
        stem:"A patient with community-acquired pneumonia develops respiratory insufficiency, leukocytosis, and lung imaging showing tissue destruction. This complication is:",
        options:[
          "Necrotizing pneumonia",
          "Atelectasis",
          "Mycoplasma pneumonia",
          "Cytomegalovirus pneumonia"],
        answer:[0],
        rationale:"Necrotizing pneumonia is a rare complication of bacterial lung infection (often with CAP), commonly from Staphylococcus, Klebsiella, or Streptococcus. It causes respiratory insufficiency/failure, leukocytosis, and imaging abnormalities, and needs long-term antibiotics and possibly surgery.",
        mnemonic:"NECRO = tissue-destroying; think Staph/Klebsiella/Strep." },

      { cid:"pna-13", cat:"Assessment", type:"sata",
        stem:"Which are common clinical cues of pneumonia the nurse expects to assess? Select all that apply.",
        options:[
          "Productive cough with green, yellow, or rust-colored sputum",
          "Fever and chills",
          "Pleuritic chest pain",
          "Dyspnea and tachypnea",
          "Bradycardia with hypothermia in all patients",
          "Weight gain from fluid overload"],
        answer:[0,1,2,3],
        rationale:"Common cues include productive or nonproductive cough (green/yellow/rust sputum), fever, chills, dyspnea, tachypnea, and pleuritic chest pain. Older/debilitated patients may show confusion. Bradycardia/hypothermia in all patients and weight gain are not typical.",
        mnemonic:"PNEUMONIA cues: 'Cough-Color, Fever-Chills, Dyspnea, Pleuritic pain.'" },

      { cid:"pna-14", cat:"Pathophysiology", type:"single",
        stem:"The nurse explains consolidation to a patient. Which description is correct?",
        options:[
          "Alveoli become filled with fluid and debris, impairing gas exchange",
          "Air or gas is completely absent from lung areas that have collapsed",
          "The pleural space fills with air, collapsing the lung",
          "The bronchi permanently dilate and fill with pus"],
        answer:[0],
        rationale:"Consolidation is when alveoli fill with fluid and/or debris (typical of bacterial pneumonia), obstructing airflow and impairing gas exchange. Absence of air in collapsed areas describes atelectasis; air in the pleural space describes pneumothorax.",
        mnemonic:"Consolidation = alveoli 'clogged'; Atelectasis = alveoli 'airless/collapsed.'" },

      { cid:"pna-15", cat:"Assessment", type:"single",
        stem:"On exam of a patient with pneumonia and consolidation, which finding does the nurse expect?",
        options:[
          "Bronchial breath sounds and increased tactile fremitus over the affected area",
          "Hyperresonance with absent breath sounds",
          "Decreased fremitus with a tympanic percussion note",
          "Normal vesicular breath sounds throughout"],
        answer:[0],
        rationale:"Consolidation transmits sound better, producing bronchial breath sounds, egophony, and increased tactile fremitus over the affected region. Fine/coarse crackles are common. Hyperresonance/absent sounds suggest pneumothorax, not consolidation.",
        mnemonic:"Solid lung = sound travels: bronchial sounds, Egophony, ↑Fremitus." },

      { cid:"pna-16", cat:"Gerontology", type:"single",
        stem:"An older adult is admitted with new confusion and lethargy but only a low-grade temperature. The nurse recognizes that in older patients, pneumonia may present primarily as:",
        options:[
          "Confusion or stupor rather than a classic high fever",
          "Severe hemoptysis in every case",
          "A barrel-shaped chest",
          "Sudden weight gain"],
        answer:[0],
        rationale:"Older or debilitated patients may present with confusion or stupor as a leading sign, and older adults may show hyperthermia, diaphoresis, anorexia, fatigue, and myalgias rather than a classic fever pattern. New confusion should prompt evaluation for infection.",
        mnemonic:"In elders, pneumonia 'talks through the brain' - new confusion = red flag." },

      { cid:"pna-17", cat:"Complications", type:"sata",
        stem:"Which are recognized complications of pneumonia? Select all that apply.",
        options:[
          "Pleural effusion",
          "Bacteremia",
          "Pneumothorax",
          "Acute respiratory failure",
          "Improved oxygenation",
          "Spontaneous cure without any risk of sepsis"],
        answer:[0,1,2,3],
        rationale:"Complications include atelectasis, pleurisy, pleural effusion, bacteremia, pneumothorax, acute respiratory failure, and sepsis/septic shock. Improved oxygenation and a no-risk course are not complications.",
        mnemonic:"Pneumonia can 'SPREAD': Sepsis, Pleural effusion/pleurisy, Respiratory failure, Effusion→empyema, bActeremia, penumothoraxD." },

      { cid:"pna-18", cat:"Diagnostics", type:"single",
        stem:"For a patient with suspected bacterial pneumonia, when should a sputum specimen for Gram stain, culture, and sensitivity ideally be collected?",
        options:[
          "Before antibiotics are started",
          "After 48 hours of antibiotics",
          "Only once the patient is afebrile",
          "Collection timing does not matter"],
        answer:[0],
        rationale:"Sputum for Gram stain, culture, and sensitivity should ideally be obtained before antibiotics are started so the causative organism can be identified and therapy tailored. Antibiotics before collection can reduce culture yield.",
        mnemonic:"Culture BEFORE you cure (antibiotics)." },

      { cid:"pna-19", cat:"Diagnostics", type:"single",
        stem:"Which diagnostic study is a primary tool used to confirm and evaluate pneumonia?",
        options:[
          "Chest x-ray",
          "Electrocardiogram",
          "Serum lipase",
          "Bone density scan"],
        answer:[0],
        rationale:"Diagnostic studies for pneumonia include history and physical, chest x-ray, pulse oximetry, ABGs, sputum culture, blood cultures, and CBC with differential; thoracentesis/bronchoscopy may be used. ECG, lipase, and bone density are not diagnostic for pneumonia.",
        mnemonic:"Pneumonia workup: 'CXR + Cultures + CBC + ABG.'" },

      { cid:"pna-20", cat:"Nursing Care", type:"sata",
        stem:"Which nursing interventions are appropriate in the acute care of a patient with pneumonia? Select all that apply.",
        options:[
          "Administer prescribed antibiotics and monitor the response",
          "Provide oxygen therapy, antipyretics, and analgesics as needed",
          "Encourage adequate hydration to loosen secretions",
          "Encourage deep breathing and coughing",
          "Keep the patient flat and restrict all fluids",
          "Withhold pain medication so coughing is more forceful"],
        answer:[0,1,2,3],
        rationale:"Acute care includes giving antibiotics, monitoring response, supportive measures (oxygen, antipyretics, analgesics), hydration/nutrition, positioning, and encouraging deep breathing and coughing. Keeping the patient flat, restricting fluids, and withholding pain control impair recovery and airway clearance.",
        mnemonic:"Pneumonia care 'ABCDH': Antibiotics, Breathing (deep/cough), Comfort (O2/antipyretic/analgesic), Deep-breathe, Hydrate." },

      { cid:"pna-21", cat:"Treatment", type:"single",
        stem:"The provider begins antibiotics for a patient with CAP before culture results return. The nurse understands this empiric therapy is based on:",
        options:[
          "Risk factors, clinical presentation, and the most likely causative pathogen",
          "The patient's insurance status",
          "Waiting until the organism is definitively identified",
          "Only the results of a bone scan"],
        answer:[0],
        rationale:"Empiric therapy means starting treatment before a definitive diagnosis, based on risk factors, speed of onset, clinical presentation, underlying conditions, hemodynamic stability, and the most likely pathogen. Prompt effective antibiotics improve outcomes.",
        mnemonic:"Empiric = 'Educated guess' from risk + presentation + likely bug." },

      { cid:"pna-22", cat:"Treatment", type:"single",
        stem:"A patient started on appropriate antibiotics for pneumonia should typically begin to show clinical improvement within what time frame?",
        options:[
          "48 to 72 hours",
          "Within 2 hours",
          "Only after 3 weeks",
          "Improvement is not expected with antibiotics"],
        answer:[0],
        rationale:"Response to effective antibiotics generally occurs within 48 to 72 hours (decreased temperature, improved breathing, less chest discomfort), though abnormal physical findings can last longer than 7 days. Lack of improvement in 3-5 days warrants reevaluation.",
        mnemonic:"Antibiotics: expect a turn by '48-72.'" },

      { cid:"pna-23", cat:"Nursing Care", type:"single",
        stem:"Which nutrition/hydration goal is appropriate for a patient with pneumonia (without contraindications)?",
        options:[
          "Adequate hydration to thin and loosen secretions",
          "Strict fluid restriction to under 500 mL/day for all patients",
          "A high-fat, low-protein diet to suppress cough",
          "Withholding all oral intake until the CXR is normal"],
        answer:[0],
        rationale:"Adequate hydration helps thin and loosen secretions and prevents dehydration; intake and output are monitored, and small, frequent, high-calorie, nutritious meals are encouraged. Fluids are adjusted for older adults or heart failure, but blanket severe restriction is not appropriate.",
        mnemonic:"Fluids IN = mucus THIN." },

      { cid:"pna-24", cat:"Prevention", type:"sata",
        stem:"Which actions help reduce the risk of ventilator-associated and hospital-acquired pneumonia? Select all that apply.",
        options:[
          "Elevate the head of the bed at least 30 degrees",
          "Perform twice-daily oral hygiene with chlorhexidine",
          "Adhere strictly to the ventilator bundle",
          "Use sterile technique when suctioning the trachea",
          "Keep the head of the bed flat to prevent skin breakdown",
          "Reuse contaminated ventilator circuits to save supplies"],
        answer:[0,1,2,3],
        rationale:"HOB elevation ≥30 degrees, oral care with chlorhexidine, strict ventilator-bundle adherence, and sterile suctioning reduce VAP/HAP. Keeping the patient flat promotes aspiration, and reusing contaminated circuits spreads infection.",
        mnemonic:"VAP bundle: 'HOB up, mouth clean, sterile suction, bundle followed.'" },

      { cid:"pna-25", cat:"Prevention", type:"single",
        stem:"Before feeding a patient at risk for aspiration, the nurse should first:",
        options:[
          "Assess for the presence of a gag reflex and elevate the head of the bed",
          "Lay the patient flat to make swallowing easier",
          "Give a sedative to relax the patient",
          "Feed rapidly to finish before fatigue sets in"],
        answer:[0],
        rationale:"To reduce aspiration risk, assess for a gag reflex before eating/drinking and elevate the HOB at least 30 degrees; use special caution with NG or orogastric tubes. Lying flat, sedation, and rapid feeding all increase aspiration risk.",
        mnemonic:"Before you feed: 'Gag + Up' (check gag, sit them up)." },

      { cid:"pna-26", cat:"Prevention", type:"single",
        stem:"Which vaccine does the nurse teach is used to help prevent Streptococcus pneumoniae infection?",
        options:[
          "Pneumococcal vaccine",
          "Tetanus vaccine only",
          "There is no vaccine for pneumonia prevention",
          "Rabies vaccine"],
        answer:[0],
        rationale:"The pneumococcal vaccine helps prevent S. pneumoniae infection, and influenza vaccination is also recommended, especially for at-risk patients. Health promotion emphasizes vaccination, hygiene, nutrition, rest, and avoiding smoke.",
        mnemonic:"Prevent pneumococcus → 'Pneumo shot + Flu shot.'" },

      { cid:"pna-27", cat:"Complications", type:"single",
        stem:"Which patient is at greatest risk for infection with multidrug-resistant (MDR) pathogens?",
        options:[
          "An older, immunosuppressed patient with a history of antibiotic use and prolonged mechanical ventilation",
          "A healthy young adult with a first episode of CAP",
          "A patient who has never taken antibiotics",
          "A patient with a mild viral URI"],
        answer:[0],
        rationale:"MDR pathogens are a major treatment problem; risk factors include advanced age, immunosuppression, a history of antibiotic use, and prolonged mechanical ventilation. MDR infection increases mortality from pneumonia.",
        mnemonic:"MDR loves 'AAIP': Age, Antibiotic history, Immunosuppression, Prolonged vent." },

      { cid:"pna-28", cat:"Patient Teaching", type:"single",
        stem:"Which instruction is essential when teaching a patient being discharged on oral antibiotics for pneumonia?",
        options:[
          "Take the full prescribed course of antibiotics even after feeling better",
          "Stop the antibiotics as soon as the fever resolves",
          "Skip doses if side effects are bothersome, without notifying anyone",
          "Drink alcohol freely while on the medication"],
        answer:[0],
        rationale:"Patients must complete the full course of antibiotics to prevent relapse and resistance. Teaching also covers drug-drug/drug-food interactions, adequate rest and hydration, avoiding alcohol and smoking, and that full recovery may take weeks.",
        mnemonic:"Finish the bottle - 'Full course, no shortcuts.'" },

      { cid:"pna-29", cat:"Patient Teaching", type:"sata",
        stem:"Which health-promotion points should the nurse include to help prevent pneumonia? Select all that apply.",
        options:[
          "Get influenza and pneumococcal vaccines",
          "Cough or sneeze into the elbow and practice good hand hygiene",
          "Avoid cigarette smoke",
          "Seek prompt treatment of upper respiratory infections",
          "Begin smoking to 'toughen' the lungs",
          "Avoid all fluids to keep the lungs dry"],
        answer:[0,1,2,3],
        rationale:"Health promotion includes vaccination, respiratory hygiene (cough/sneeze into elbow, handwashing), avoiding cigarette smoke, adequate nutrition/rest/exercise, and prompt treatment of URIs. Smoking and fluid avoidance increase risk and impair clearance.",
        mnemonic:"Prevent with 'VHASN': Vaccines, Hygiene, Avoid smoke, treat Sickness early, Nutrition/rest." },

      { cid:"pna-30", cat:"Clinical Judgment", type:"single",
        stem:"A patient with severe pneumonia becomes increasingly dyspneic with falling oxygen saturation and rising confusion. Which complication requires the nurse's immediate priority action?",
        options:[
          "Acute respiratory failure with ineffective O2 and CO2 exchange",
          "Mild dehydration",
          "A resolving low-grade fever",
          "Expected improvement from antibiotics"],
        answer:[0],
        rationale:"Worsening dyspnea, falling SpO2, and rising confusion signal acute respiratory failure - a leading cause of death in severe pneumonia due to ineffective O2 and CO2 exchange. This demands immediate assessment, oxygenation support, and provider notification.",
        mnemonic:"Rising confusion + falling sats = 'brain starving' → ARF, act now." }
    ],
    B: [
      { cid:"pna-01", cat:"Overview", type:"single",
        stem:"A patient asks why pneumonia is 'such a big deal.' Which response by the nurse best reflects its impact?",
        options:[
          "It is an acute infection of the lung tissue and, with lower respiratory infections, was among the top causes of death worldwide",
          "It is a minor cold that clears on its own",
          "It is a non-infectious swelling of the throat",
          "It never leads to hospitalization or death"],
        answer:[0],
        rationale:"Pneumonia is an acute infection of the lung parenchyma associated with significant morbidity and mortality; with lower respiratory tract infections it ranked among the leading causes of death worldwide. It is infectious and can be serious.",
        mnemonic:"PARENCHYMA = 'Parenchyma Attacked, Really Extensive Notable Cause of death, Hits Your Multiple Alveoli.'" },

      { cid:"pna-02", cat:"Pathophysiology", type:"single",
        stem:"A patient develops pneumonia when bacteria from a distant infected wound travel through the blood to the lungs. Which route is this?",
        options:[
          "Hematogenous spread from a primary infection elsewhere",
          "Inhalation of airborne microbes",
          "Aspiration of oropharyngeal flora",
          "Migration across an intact pleura"],
        answer:[0],
        rationale:"Hematogenous spread means organisms travel through the bloodstream from a primary infection elsewhere to the lungs. The other true routes are inhalation and aspiration; spread across an intact pleura is not one of the three classic routes.",
        mnemonic:"3 roads to the lung: 'AIH' = Aspiration, Inhalation, Hematogenous." },

      { cid:"pna-03", cat:"Pathophysiology", type:"single",
        stem:"Which of the following is an intact defense that helps keep the lower airway sterile?",
        options:[
          "Epiglottic closure over the trachea during swallowing",
          "A chronically suppressed cough reflex",
          "Impaired ciliary movement from smoking",
          "Decline of IgA and macrophages with illness"],
        answer:[0],
        rationale:"Epiglottic closure over the trachea is a normal defense, along with air filtration, cough reflex, mucociliary escalator, reflex bronchoconstriction, and immune components. A suppressed cough, impaired cilia, and declining immunity are impairments, not defenses.",
        mnemonic:"Escalator UP = mucus and microbes ride OUT." },

      { cid:"pna-04", cat:"Risk Factors", type:"sata",
        stem:"A nurse reviews conditions that overwhelm pulmonary defenses and predispose to pneumonia. Select all that apply.",
        options:[
          "Chronic diseases such as COPD or diabetes",
          "Air pollution exposure",
          "Aging",
          "A well-balanced diet",
          "A recent viral upper respiratory infection",
          "Frequent handwashing"],
        answer:[0,1,2,4],
        rationale:"Chronic disease, air pollution, aging, smoking, intubation, and a recent viral URI impair or overwhelm defenses. A balanced diet and handwashing are protective behaviors, not risk factors.",
        mnemonic:"Defenses drop with 'SITA-V': Smoking, Intubation, Toxins/pollution, Age, Viral URI." },

      { cid:"pna-05", cat:"Classification", type:"single",
        stem:"A 60-year-old who lives independently and has had no health care contact for months develops pneumonia. This is classified as:",
        options:[
          "Community-acquired pneumonia (CAP)",
          "Ventilator-associated pneumonia (VAP)",
          "Hospital-acquired pneumonia (HAP)",
          "Opportunistic pneumonia"],
        answer:[0],
        rationale:"With no hospitalization or long-term care within 14 days of onset, this is CAP. It may be treated at home or in the hospital depending on age, vital signs, mental status, comorbidities, and severity (e.g., CURB-65).",
        mnemonic:"CAP = Caught At Public/home place." },

      { cid:"pna-06", cat:"Classification", type:"single",
        stem:"Which finding best supports a diagnosis of hospital-acquired pneumonia?",
        options:[
          "New pneumonia appearing 60 hours after admission that was absent on arrival",

        rationale:"Severe dyspnea, purulent sputum, new confusion, rising PaCO2, and worsening hypoxemia indicate an exacerbation progressing to acute respiratory failure. Immediate intervention - oxygen, provider notification, and possible noninvasive ventilation (BiPAP) - is the priority; care must not be delayed.",
        mnemonic:"Exacerbation + confusion + falling O2 = act NOW, don't wait." }
    ]
  }
};
</script>
<script>
