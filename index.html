    "copd-13":"Complications","copd-14":"Spirometry (FEV1/FVC)","copd-15":"Oxygen & survival",
    "copd-16":"Oxygen goals / targets","copd-17":"Diagnostic studies","copd-18":"Bronchodilators first-line",
    "copd-19":"Pursed-lip breathing","copd-20":"Diaphragmatic breathing","copd-21":"Nursing interventions",
    "copd-22":"Nutrition","copd-23":"Exacerbation signs","copd-24":"Triple therapy",
    "copd-25":"Health promotion","copd-26":"Smoking cessation","copd-27":"Pulmonary rehabilitation",
    "copd-28":"Energy conservation","copd-29":"Self-management teaching","copd-30":"Recognizing respiratory failure"
  };
  function conceptLabel(cid){ return CONCEPT_LABELS[cid] || cid; }

  /* -------------------- storage helpers -------------------- */
  var SCORE_KEY = "nur243_resp_scores_v1";
  var MISS_KEY  = "nur243_resp_misses_v1";
  function lsGet(key, fallback){
    try{ var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function lsSet(key, val){
    try{ window.localStorage.setItem(key, JSON.stringify(val)); }catch(e){/* ignore */}
  }
  function getScores(){ var a = lsGet(SCORE_KEY, []); return Array.isArray(a) ? a : []; }
  function addScore(rec){
    var a = getScores(); a.unshift(rec); a = a.slice(0,8); lsSet(SCORE_KEY, a);
  }
  function resetScores(){ lsSet(SCORE_KEY, []); }
  function getMisses(){ var o = lsGet(MISS_KEY, {}); return (o && typeof o==="object") ? o : {}; }
  function recordMisses(subjectKey, cids){
    if(!cids.length) return;
    var all = getMisses(); var sub = all[subjectKey] || {};
    cids.forEach(function(cid){ sub[cid] = (sub[cid]||0) + 1; });
    all[subjectKey] = sub; lsSet(MISS_KEY, all);
  }

  /* -------------------- utils -------------------- */
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function sameSet(a,b){
    if(a.length!==b.length) return false;
    var s = a.slice().sort().join(","), t = b.slice().sort().join(",");
    return s===t;
  }
  function esc(str){
    return String(str).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function fmtDate(ts){
    var d = new Date(ts);
    var mo = d.toLocaleString(undefined,{month:"short"});
    var h = d.getHours(), m = d.getMinutes();
    var ap = h>=12?"pm":"am"; var hh = h%12; if(hh===0) hh=12;
    return mo+" "+d.getDate()+", "+hh+":"+(m<10?"0"+m:m)+ap;
  }
  function fmtClock(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m+":"+(s<10?"0"+s:s);
  }

  /* -------------------- app state -------------------- */
  var app = document.getElementById("app");
  var backdrop = document.getElementById("backdrop");
  var landing = { subject:null, mode:"study" };
  var quiz = null;      // active quiz session
  var calcState = null; // calculator state

  /* ============================================================
     LANDING
     ============================================================ */
  function renderLanding(){
    stopTimer();
    quiz = null;
    removeCalc();
    setTutorAvailable(true);
    var subjKeys = SUBJECT_ORDER.filter(function(k){ return window.QBANK && window.QBANK[k]; });

    var html = "";
    html += '<div class="card brand">'
          +   '<p class="script">respiratory review</p>'
          +   '<h1>NUR&nbsp;243<br>NCLEX Practice</h1>'
          +   '<p class="sub">Pick a subject → choose a mode → start a version</p>'
          + '</div>';

    /* Step 1: subject picker */
    html += '<div class="card">'
          +   '<div class="section-label"><span class="step">1</span> Choose a subject</div>'
          +   '<div class="subject-grid">';
    subjKeys.forEach(function(k){
      var sel = landing.subject===k ? " selected" : "";
      html += '<button class="btn subject-btn'+sel+'" data-act="subject" data-subject="'+k+'">'
            +   '<span class="em">'+SUBJECT_EMOJI[k]+'</span>'
            +   '<span>'+esc(window.QBANK[k].name)+'</span>'
            +   '<small>'+esc(SUBJECT_TAG[k])+'</small>'
            + '</button>';
    });
    html += '</div></div>';

    /* Step 2: mode toggle */
    var studyOn = landing.mode==="study";
    html += '<div class="card">'
          +   '<div class="section-label"><span class="step">2</span> Study or Exam mode</div>'
          +   '<div class="toggle">'
          +     '<button data-act="mode" data-mode="study" class="'+(studyOn?"on":"")+'">📖 Study</button>'
          +     '<button data-act="mode" data-mode="exam" class="'+(!studyOn?"on":"")+'">⏱️ Exam</button>'
          +   '</div>'
          +   '<div class="mode-desc">'+ (studyOn
                ? "Study: check each answer as you go — correct choices turn green, wrong picks red, then read the rationale and mnemonic before moving on. No timer."
                : "Exam: no feedback until the end. A countdown gives you 1 minute per question (turns red in the last minute) and auto-submits when time runs out — unanswered questions count as wrong.")
          +   '</div>'
          + '</div>';

    /* Step 3: version buttons */
    var subjName = landing.subject ? window.QBANK[landing.subject].name : null;
    html += '<div class="card">'
          +   '<div class="section-label"><span class="step">3</span> Start a test</div>';
    if(!landing.subject){
      html += '<div class="empty">Choose a subject above to unlock the three test versions.</div>';
    } else {
      html += '<div class="version-row">';
      VERSIONS.forEach(function(v){
        html += '<button class="btn dark" data-act="start" data-subject="'+landing.subject+'" data-version="'+v+'">'
              +   esc(subjName)+' — Version '+v
              + '</button>';
      });
      html += '</div>';
      html += '<p class="hint">All three versions cover the same 30 concepts in the same order and format — only the scenarios and wording change, so A, B, and C are interchangeable practice sets.</p>';
    }
    html += '</div>';

    /* Recent scores */
    html += renderScoresCard();

    html += '<p class="footer-note">Scores and weak-concept tracking are saved privately in this browser. NUR 243 Respiratory · for study use.</p>';

    app.innerHTML = html;
    window.scrollTo(0,0);
  }

  function renderScoresCard(){
    var scores = getScores();
    var html = '<div class="card">'
             +   '<div class="scores-head">'
             +     '<div class="section-label" style="margin:0;">📊 Recent scores</div>';
    if(scores.length){
      html += '<button class="linkbtn" data-act="reset-scores">Reset</button>';
    }
    html += '</div>';
    if(!scores.length){
      html += '<div class="empty">No attempts yet. Finish a test and your last 8 results show up here.</div>';
    } else {
      html += '<table class="scores-table"><thead><tr>'
            +   '<th>Subject</th><th>Ver</th><th>Mode</th><th>Score</th><th>When</th>'
            + '</tr></thead><tbody>';
      scores.forEach(function(s){
        var pct = Math.round((s.correct/s.total)*100);
        html += '<tr>'
              +   '<td>'+esc(s.subjectName)+'</td>'
              +   '<td>'+esc(s.version || "–")+'</td>'
              +   '<td><span class="pill '+(s.mode==="exam"?"exam":"study")+'">'+(s.mode==="exam"?"Exam":"Study")+'</span></td>'
              +   '<td class="sc">'+s.correct+'/'+s.total+' <span style="color:var(--ink-soft);font-weight:700;">('+pct+'%)</span></td>'
              +   '<td>'+fmtDate(s.ts)+'</td>'
              + '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    return html;
  }

  /* ============================================================
     QUIZ SETUP
     ============================================================ */
  function buildQuizQuestions(sourceList){
    // Wrap each source question with a shuffled display + empty selection.
    return sourceList.map(function(q){
      var display = shuffle(q.options.map(function(text, idx){ return { text:text, orig:idx }; }));
      return {
        cid:q.cid, cat:q.cat, type:q.type, stem:q.stem,
        options:q.options, answer:q.answer, rationale:q.rationale, mnemonic:q.mnemonic,
        display:display,
        selected:[],       // array of original indices chosen
        answered:false,
        correct:null
      };
    });
  }

  function startQuiz(opts){
    // opts: subjectKey, version, mode, source ('full'|'missed'|'similar'), questions(list), title
    removeCalc();
    var subjectKey = opts.subjectKey;
    var version = opts.version;
    var mode = opts.mode;
    var srcQuestions = opts.questions;

    quiz = {
      subjectKey: subjectKey,
      subjectName: window.QBANK[subjectKey].name,
      version: version,
      mode: mode,
      source: opts.source || "full",
      title: opts.title || null,
      questions: buildQuizQuestions(srcQuestions),
      index: 0,
      checked: false,             // study-mode: current question checked
      finished: false,
      timeTotal: srcQuestions.length * SECONDS_PER_Q,
      timeLeft: srcQuestions.length * SECONDS_PER_Q,
      timerId: null
    };
    if(mode==="exam"){ startTimer(); }
    renderQuestion();
  }

  /* -------------------- timer -------------------- */
  function startTimer(){
    stopTimer();
    quiz.timerId = window.setInterval(function(){
      if(!quiz){ stopTimer(); return; }
      quiz.timeLeft--;
      updateTimerDisplay();
      if(quiz.timeLeft <= 0){
        stopTimer();
        finishQuiz(true); // time out -> auto submit
      }
    }, 1000);
  }
  function stopTimer(){
    if(quiz && quiz.timerId){ window.clearInterval(quiz.timerId); quiz.timerId=null; }
  }
  function updateTimerDisplay(){
    var el = document.getElementById("timer");
    if(!el || !quiz) return;
    el.textContent = fmtClock(Math.max(0,quiz.timeLeft));
    if(quiz.timeLeft <= 60){ el.classList.add("warn"); } else { el.classList.remove("warn"); }
  }

  /* ============================================================
     QUESTION RENDER
     ============================================================ */
  function renderQuestion(){
    var q = quiz.questions[quiz.index];
    var total = quiz.questions.length;
    var isExam = quiz.mode==="exam";

    var html = "";
    html += '<div class="topbar">'
          +   '<button class="back" data-act="quit-quiz">← Exit</button>'
          + '</div>';

    /* sticky bar: meta + timer + bubbles */
    html += '<div class="quiz-top"><div class="qbar">'
          +   '<div class="qbar-row">'
          +     '<span class="qmeta">'+esc(quiz.subjectName)+ (quiz.version? ' · Ver '+quiz.version : '') +' · Q'+(quiz.index+1)+'/'+total+'</span>'
          +     (isExam ? '<span class="timer" id="timer">'+fmtClock(quiz.timeLeft)+'</span>'
                        : '<span class="timer" style="background:var(--accent-soft);">📖 Study</span>')
          +   '</div>'
          +   '<div class="bubbles">'+bubblesHTML()+'</div>'
          + '</div></div>';

    /* question card */
    html += '<div class="card">';
    html += '<span class="cat-tag">'+esc(q.cat)+'</span>';
    if(q.type==="sata"){ html += '<span class="cat-tag sata-tag">Select all that apply</span>'; }
    html += '<p class="stem">'+esc(q.stem)+'</p>';
    html += '<div class="options" id="options">'+optionsHTML(q)+'</div>';

    /* feedback area (study, after check) */
    if(quiz.mode==="study" && quiz.checked){
      html += feedbackHTML(q);
    }

    /* actions */
    html += '<div class="qactions">'+actionsHTML(q)+'</div>';
    html += '</div>';

    app.innerHTML = html;
    mountCalc();
    setTutorAvailable(!isExam);
    if(isExam){ updateTimerDisplay(); }
    window.scrollTo(0,0);
  }

  function bubblesHTML(){
    var out = "";
    quiz.questions.forEach(function(q,i){
      var cls = "bub";
      if(i===quiz.index) cls += " cur";
      if(quiz.mode==="study"){
        if(q.answered && q.correct===true) cls += " correct";
        else if(q.answered && q.correct===false) cls += " wrong";
        else if(q.selected.length) cls += " done";
      } else {
        if(q.selected.length) cls += " done";
      }
      out += '<span class="'+cls+'"></span>';
    });
    return out;
  }

  function optionsHTML(q){
    var out = "";
    var revealing = (quiz.mode==="study" && quiz.checked);
    var letters = "ABCDEF";
    q.display.forEach(function(opt, i){
      var isSel = q.selected.indexOf(opt.orig) !== -1;
      var isCorrect = q.answer.indexOf(opt.orig) !== -1;
      var cls = "opt " + (q.type==="sata" ? "sata" : "single");
      var boxChar = letters[i];
      if(revealing){
        if(isCorrect && isSel){ cls += " correct"; boxChar = "✓"; }
        else if(isCorrect && !isSel){ cls += " missed"; boxChar = "✓"; }
        else if(!isCorrect && isSel){ cls += " wrong"; boxChar = "✗"; }
      } else if(isSel){
        cls += " sel";
        boxChar = q.type==="sata" ? "✓" : letters[i];
      }
      out += '<button type="button" class="'+cls+'" data-act="opt" data-i="'+i+'"'+(revealing?' disabled':'')+'>'
           +   '<span class="box">'+boxChar+'</span>'
           +   '<span class="otext">'+esc(opt.text)+'</span>'
           + '</button>';
    });
    return out;
  }

  function feedbackHTML(q){
    var ok = q.correct===true;
    var correctTexts = q.answer.map(function(oi){ return q.options[oi]; });
    var html = '<div class="feedback '+(ok?"ok":"no")+'">'
             +   '<div class="verdict">'+(ok?"✅ Correct":"❌ Not quite")+'</div>';
    if(!ok){
      html += '<div style="font-size:13.5px;">Correct answer'+(q.answer.length>1?"s":"")+': <b>'+esc(correctTexts.join(" · "))+'</b></div>';
    }
    html += '<div class="lbl">Rationale</div><div>'+esc(q.rationale)+'</div>'
          + '<div class="lbl">Mnemonic</div><div class="mn">'+esc(q.mnemonic)+'</div>'
          + '<button class="btn soft tutor-ask" data-act="tutor-ask" data-idx="'+quiz.index+'">💬 Ask the tutor about this</button>'
          + '</div>';
    return html;
  }

  function actionsHTML(q){
    var last = quiz.index === quiz.questions.length-1;
    var out = "";
    // Back button (not on first)
    if(quiz.index>0){
      out += '<button class="btn soft" data-act="prev">← Back</button>';
    }
    if(quiz.mode==="study"){
      if(!quiz.checked){
        out += '<button class="btn" data-act="check">Check answer</button>';
      } else {
        out += '<button class="btn" data-act="next">'+(last?"See results":"Next →")+'</button>';
      }
    } else {
      // exam: just Next / Submit
      out += '<button class="btn" data-act="next">'+(last?"Submit exam":"Next →")+'</button>';
    }
    return out;
  }

  /* -------------------- interactions -------------------- */
  function selectOption(displayIdx){
    var q = quiz.questions[quiz.index];
    if(quiz.mode==="study" && quiz.checked) return; // locked after check
    var orig = q.display[displayIdx].orig;
    if(q.type==="single"){
      q.selected = [orig];
    } else {
      var pos = q.selected.indexOf(orig);
      if(pos===-1){ q.selected.push(orig); } else { q.selected.splice(pos,1); }
    }
    // re-render options + bubbles only
    var optsEl = document.getElementById("options");
    if(optsEl){ optsEl.innerHTML = optionsHTML(q); }
    refreshBubbles();
  }
  function refreshBubbles(){
    var b = document.querySelector(".bubbles");
    if(b){ b.innerHTML = bubblesHTML(); }
  }

  function checkAnswer(){
    var q = quiz.questions[quiz.index];
    if(!q.selected.length){ nudge("Select an answer first."); return; }
    q.answered = true;
    q.correct = sameSet(q.selected, q.answer);
    quiz.checked = true;
    renderQuestion();
  }

  function gradeCurrentIfNeeded(){
    // exam mode: record selection state as answered when navigating
    var q = quiz.questions[quiz.index];
    if(quiz.mode==="exam"){
      q.answered = q.selected.length>0;
      q.correct = q.selected.length ? sameSet(q.selected, q.answer) : false;
    }
  }

  function nextQuestion(){
    gradeCurrentIfNeeded();
    if(quiz.index === quiz.questions.length-1){
      finishQuiz(false);
      return;
    }
    quiz.index++;
    quiz.checked = quiz.mode==="study" ? quiz.questions[quiz.index].answered && false : false;
    // In study mode, if the question was already answered earlier (via back nav), show it checked
    if(quiz.mode==="study" && quiz.questions[quiz.index].answered){ quiz.checked = true; }
    renderQuestion();
  }
  function prevQuestion(){
    gradeCurrentIfNeeded();
    if(quiz.index===0) return;
    quiz.index--;
    quiz.checked = (quiz.mode==="study" && quiz.questions[quiz.index].answered) ? true : false;
    renderQuestion();
  }

  function nudge(msg){
    var el = document.querySelector(".qactions");
    if(!el) return;
    var n = document.createElement("div");
    n.textContent = msg;
    n.style.cssText = "flex-basis:100%;color:var(--bad);font-weight:700;font-size:13px;text-align:center;margin-top:2px;";
    // remove old
    var old = el.querySelector(".nudge"); if(old) old.remove();
    n.className = "nudge";
    el.appendChild(n);
    window.setTimeout(function(){ if(n && n.parentNode) n.remove(); }, 1800);
  }

  /* ============================================================
     FINISH + RESULTS
     ============================================================ */
  function finishQuiz(timedOut){
    stopTimer();
    quiz.finished = true;
    // Grade every question (unanswered = wrong)
    quiz.questions.forEach(function(q){
      q.answered = q.selected.length>0;
      q.correct = q.selected.length ? sameSet(q.selected, q.answer) : false;
    });
    var correct = quiz.questions.filter(function(q){ return q.correct; }).length;
    var total = quiz.questions.length;

    // Record score + misses (only full versions count toward "recent scores" cleanly, but we log all)
    addScore({
      subjectKey: quiz.subjectKey,
      subjectName: quiz.subjectName + (quiz.title ? " ("+quiz.title+")" : ""),
      version: quiz.version || "",
      mode: quiz.mode,
      correct: correct,
      total: total,
      ts: Date.now()
    });
    var missedCids = quiz.questions.filter(function(q){ return !q.correct; }).map(function(q){ return q.cid; });
    recordMisses(quiz.subjectKey, missedCids);

    renderResults(timedOut);
  }

  function renderResults(timedOut){
    var qs = quiz.questions;
    var total = qs.length;
    var correct = qs.filter(function(q){ return q.correct; }).length;
    var pct = Math.round((correct/total)*100);
    var ringColor = pct>=80 ? "linear-gradient(150deg,#2aa35a,#1f8a4c)"
                  : pct>=60 ? "linear-gradient(150deg,#e0932f,#c67b18)"
                            : "linear-gradient(150deg,#d8455a,#b8283b)";

    // per-category
    var catMap = {};
    qs.forEach(function(q){
      if(!catMap[q.cat]) catMap[q.cat] = {c:0,t:0};
      catMap[q.cat].t++; if(q.correct) catMap[q.cat].c++;
    });

    var html = "";
    html += '<div class="topbar"><button class="back" data-act="home">🏠 Home</button></div>';

    // hero
    html += '<div class="card score-hero">';
    if(timedOut){ html += '<div style="color:var(--bad);font-weight:800;margin-bottom:6px;">⏱️ Time expired — exam auto-submitted</div>'; }
    html += '<div class="section-label" style="justify-content:center;">'+esc(quiz.subjectName)+ (quiz.version?' · Version '+quiz.version:'') + (quiz.title? ' · '+esc(quiz.title):'') +'</div>'
          + '<div class="score-ring" style="background:'+ringColor+';">'
          +   '<span class="pct">'+pct+'%</span>'
          +   '<span class="frac">'+correct+' / '+total+' correct</span>'
          + '</div>'
          + '<div class="score-sub">'+ (pct>=80?"Strong work — exam-ready on most of this.": pct>=60?"Solid start — target the weak spots below.":"Keep going — review the rationales and retry.") +'</div>'
          + '</div>';

    // per-category breakdown
    html += '<div class="card"><div class="section-label">🧩 By category (this attempt)</div><div class="breakdown">';
    Object.keys(catMap).forEach(function(cat){
      var r = catMap[cat]; var p = Math.round((r.c/r.t)*100);
      var lvl = p>=80?"high":(p>=60?"mid":"low");
      html += '<div class="bd-row"><div class="bd-top"><span>'+esc(cat)+'</span><span class="n">'+r.c+'/'+r.t+'</span></div>'
            + '<div class="bar"><span class="'+lvl+'" style="width:'+p+'%"></span></div></div>';
    });
    html += '</div></div>';

    // weakest concepts (accumulated across all attempts & versions)
    var subMiss = getMisses()[quiz.subjectKey] || {};
    var weakArr = Object.keys(subMiss).map(function(cid){ return {cid:cid, n:subMiss[cid]}; })
                        .filter(function(x){ return x.n>0; })
                        .sort(function(a,b){ return b.n-a.n; })
                        .slice(0,6);
    html += '<div class="card"><div class="section-label">🔥 Weakest concepts in '+esc(quiz.subjectName)+'</div>';
    if(!weakArr.length){
      html += '<div class="empty">No missed concepts recorded yet — nice.</div>';
    } else {
      html += '<p class="hint" style="margin-top:0;">Miss counts add up across every attempt and version you take of this subject.</p>';
      html += '<ul class="weak-list">';
      weakArr.forEach(function(w){
        html += '<li><span class="wl">'+esc(conceptLabel(w.cid))+'</span><span class="wc">missed ×'+w.n+'</span></li>';
      });
      html += '</ul>';
    }
    html += '</div>';

    // review list
    html += '<div class="card"><div class="section-label">🔎 Review all '+total+' questions</div><p class="hint" style="margin-top:0;">Tap any question to expand its rationale and mnemonic.</p>';
    qs.forEach(function(q, i){
      var ok = q.correct;
      var yourTexts = q.selected.length ? q.selected.map(function(oi){return q.options[oi];}).join(" · ") : "(no answer)";
      var corrTexts = q.answer.map(function(oi){ return q.options[oi]; }).join(" · ");
      html += '<div class="review-item" data-idx="'+i+'">'
            +   '<div class="review-q" data-act="toggle-review">'
            +     '<span class="mark '+(ok?"ok":"no")+'">'+(ok?"✓":"✗")+'</span>'
            +     '<span class="rq-text">'+(i+1)+'. '+esc(q.stem)+'</span>'
            +     '<span class="chev">▾</span>'
            +   '</div>'
            +   '<div class="review-body">'
            +     '<div class="ra"><b>Your answer:</b> '+esc(yourTexts)+'</div>'
            +     '<div class="ra"><b>Correct:</b> '+esc(corrTexts)+'</div>'
            +     '<div class="ra"><b>Rationale:</b> '+esc(q.rationale)+'</div>'
            +     '<div class="mn">'+esc(q.mnemonic)+'</div>'
            +     '<button class="btn soft tutor-ask" data-act="tutor-ask" data-idx="'+i+'">💬 Ask the tutor about this</button>'
            +   '</div>'
            + '</div>';
    });
    html += '</div>';

    // action buttons
    var missedCount = qs.filter(function(q){return !q.correct;}).length;
    html += '<div class="card"><div class="section-label">➡️ What next?</div><div class="results-actions">';
    // Practice similar (missed concepts, next version)
    if(missedCount>0){
      html += '<button class="btn" data-act="practice-similar">🎯 Practice similar questions ('+missedCount+' concept'+(missedCount>1?"s":"")+', Version '+NEXT_VERSION[quiz.version||"A"]+')</button>';
      html += '<button class="btn soft" data-act="retry-missed">🔁 Retry missed only ('+missedCount+')</button>';
    } else {
      html += '<div class="empty" style="text-align:center;">Perfect score — nothing to retry. 🎉</div>';
    }
    html += '<button class="btn ghost" data-act="retake">↻ Retake this version</button>';
    html += '<button class="btn ghost" data-act="choose-version">📚 Choose another version</button>';
    html += '<button class="btn dark" data-act="home">🏠 Back to home</button>';
    html += '</div></div>';

    app.innerHTML = html;
    removeCalc();
    setTutorAvailable(true);
    window.scrollTo(0,0);
  }

  /* -------------------- results actions -------------------- */
  function sourceQuestionsForCids(subjectKey, version, cids){
    var list = window.QBANK[subjectKey].versions[version];
    var byCid = {};
    list.forEach(function(q){ byCid[q.cid] = q; });
    // keep original concept order
    return list.filter(function(q){ return cids.indexOf(q.cid)!==-1; });
  }
  function practiceSimilar(){
    var missed = quiz.questions.filter(function(q){return !q.correct;}).map(function(q){return q.cid;});
    var nextV = NEXT_VERSION[quiz.version||"A"];
    var src = sourceQuestionsForCids(quiz.subjectKey, nextV, missed);
    if(!src.length){ renderLanding(); return; }
    startQuiz({ subjectKey:quiz.subjectKey, version:nextV, mode:quiz.mode, source:"similar",
               questions:src, title:"Practice similar" });
  }
  function retryMissed(){
    var missedCids = quiz.questions.filter(function(q){return !q.correct;}).map(function(q){return q.cid;});
    var v = quiz.version || "A";
    var src = sourceQuestionsForCids(quiz.subjectKey, v, missedCids);
    if(!src.length){ renderLanding(); return; }
    startQuiz({ subjectKey:quiz.subjectKey, version:v, mode:quiz.mode, source:"missed",
               questions:src, title:"Missed only" });
  }
  function retake(){
    var v = quiz.version || "A";
    startQuiz({ subjectKey:quiz.subjectKey, version:v, mode:quiz.mode, source:"full",
               questions:window.QBANK[quiz.subjectKey].versions[v] });
  }
  function chooseVersion(){
    landing.subject = quiz.subjectKey;
    renderLanding();
    // scroll to version card
    window.setTimeout(function(){
      var cards = app.querySelectorAll(".card");
      if(cards[3]) cards[3].scrollIntoView({behavior:"smooth", block:"start"});
    }, 60);
  }

  /* ============================================================
     CALCULATOR (pinned)
     ============================================================ */
  function mountCalc(){
    removeCalc();
    var bar = document.createElement("div");
    bar.className = "calc-bar";
    bar.id = "calc-bar";
    bar.innerHTML = '<button data-act="calc-open">🧮 Calculator</button>';
    document.body.appendChild(bar);

    var panel = document.createElement("div");
    panel.className = "calc-panel";
    panel.id = "calc-panel";
    panel.innerHTML = calcPanelHTML();
    document.body.appendChild(panel);
    calcState = { cur:"0", prev:null, op:null, justEval:false, expr:"" };
  }
  function removeCalc(){
    var b = document.getElementById("calc-bar"); if(b) b.remove();
    var p = document.getElementById("calc-panel"); if(p) p.remove();
    if(backdrop) backdrop.classList.remove("open");
  }
  function calcPanelHTML(){
    return '<div class="calc-head"><span class="t">🧮 Calculator</span>'
         +   '<button class="calc-close" data-act="calc-close">Done</button></div>'
         + '<div class="calc-display"><div class="expr" id="calc-expr"></div><div class="cur" id="calc-cur">0</div></div>'
         + '<div class="calc-grid">'
         +   '<button class="fn" data-calc="clear">C</button>'
         +   '<button class="fn" data-calc="back">⌫</button>'
         +   '<button class="fn" data-calc="pct">%</button>'
         +   '<button class="op" data-calc="/">÷</button>'
         +   '<button data-calc="7">7</button><button data-calc="8">8</button><button data-calc="9">9</button>'
         +   '<button class="op" data-calc="*">×</button>'
         +   '<button data-calc="4">4</button><button data-calc="5">5</button><button data-calc="6">6</button>'
         +   '<button class="op" data-calc="-">−</button>'
         +   '<button data-calc="1">1</button><button data-calc="2">2</button><button data-calc="3">3</button>'
         +   '<button class="op" data-calc="+">+</button>'
         +   '<button data-calc="0" style="grid-column:span 2;">0</button>'
         +   '<button data-calc=".">.</button>'
         +   '<button class="eq" data-calc="=">=</button>'
         + '</div>';
  }
  function openCalc(){
    var p = document.getElementById("calc-panel");
    if(p){ p.classList.add("open"); }
    if(backdrop){ backdrop.classList.add("open"); }
  }
  function closeCalc(){
    var p = document.getElementById("calc-panel");
    if(p){ p.classList.remove("open"); }
    if(backdrop){ backdrop.classList.remove("open"); }
  }
  function calcUpdate(){
    var cur = document.getElementById("calc-cur");
    var expr = document.getElementById("calc-expr");
    if(cur) cur.textContent = calcState.cur;
    if(expr){
      var opSym = {"+":"+","-":"−","*":"×","/":"÷"};
      expr.textContent = calcState.prev!==null ? (trimNum(calcState.prev)+" "+(opSym[calcState.op]||"")) : "";
    }
  }
  function trimNum(n){
    if(n===null||n===undefined) return "";
    var s = (Math.round(n*1e8)/1e8).toString();
    return s;
  }
  function calcCompute(a, b, op){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case "+": return a+b;
      case "-": return a-b;
      case "*": return a*b;
      case "/": return b===0 ? NaN : a/b;
    }
    return b;
  }
  function calcInput(key){
    var s = calcState;
    if(/^[0-9]$/.test(key)){
      if(s.cur==="0" || s.justEval){ s.cur = key; s.justEval=false; }
      else { s.cur += key; }
    } else if(key==="."){
      if(s.justEval){ s.cur="0."; s.justEval=false; }
      else if(s.cur.indexOf(".")===-1){ s.cur += "."; }
    } else if(key==="clear"){
      s.cur="0"; s.prev=null; s.op=null; s.justEval=false;
    } else if(key==="back"){
      if(s.justEval){ s.cur="0"; s.justEval=false; }
      else { s.cur = s.cur.length>1 ? s.cur.slice(0,-1) : "0"; }
    } else if(key==="pct"){
      s.cur = trimNum(parseFloat(s.cur)/100);
    } else if(key==="+"||key==="-"||key==="*"||key==="/"){
      if(s.prev!==null && s.op && !s.justEval){
        var r = calcCompute(s.prev, s.cur, s.op);
        s.prev = isNaN(r)?"Error":trimNum(r);
        s.cur = s.prev==="Error"?"0":s.prev;
      } else {
        s.prev = s.cur;
      }
      s.op = key; s.justEval=true;
    } else if(key==="="){
      if(s.prev!==null && s.op){
        var res = calcCompute(s.prev, s.cur, s.op);
        s.cur = isNaN(res)?"Error":trimNum(res);
        s.prev=null; s.op=null; s.justEval=true;
      }
    }
    calcUpdate();
  }

  /* ============================================================
     AI TUTOR HOOKS (chat itself lives in the module script below)
     ============================================================ */
  // The tutor is hidden during a timed exam so it can't be used mid-test.
  function setTutorAvailable(on){
    document.body.setAttribute("data-tutor", on ? "on" : "off");
  }
  function askTutorAbout(idx){
    var q = quiz && quiz.questions[idx];
    if(!q || !window.NURTutor) return;
    var letters = "ABCDEF";
    var optLines = q.display.map(function(opt, i){ return letters[i]+". "+opt.text; }).join("\n");
    var letterFor = function(oi){
      for(var i=0;i<q.display.length;i++){ if(q.display[i].orig===oi) return letters[i]+". "+q.options[oi]; }
      return q.options[oi];
    };
    var yours = q.selected.length ? q.selected.map(letterFor).join("; ") : "(no answer)";
    var correct = q.answer.map(letterFor).join("; ");
    var text = "I'm working on this NCLEX practice question ("+quiz.subjectName+" · "+q.cat
             + (q.type==="sata" ? " · select all that apply" : "")+"):\n\n"
             + q.stem+"\n\n"+optLines+"\n\n"
             + "My answer: "+yours+"\n"
             + "Correct answer: "+correct+"\n"
             + "Rationale from the answer key: "+q.rationale+"\n\n"
             + (q.correct
                 ? "I got it right, but help me understand the reasoning more deeply and how to recognize this kind of question next time."
                 : "I got it wrong. Help me understand why the correct answer is right, why my answer is wrong, and what to look for next time.");
    window.NURTutor.ask(text, "About Q"+(idx+1)+": "+q.stem);
  }

  /* ============================================================
     EVENT DELEGATION (click covers iOS taps on buttons)
     ============================================================ */
  function onTap(e){
    var t = e.target.closest("[data-act],[data-calc]");
    if(!t) return;

    // calculator keys
    if(t.hasAttribute("data-calc")){
      e.preventDefault();
      calcInput(t.getAttribute("data-calc"));
      return;
    }
    var act = t.getAttribute("data-act");
    switch(act){
      case "subject":
        landing.subject = t.getAttribute("data-subject");
        renderLanding();
        window.setTimeout(function(){
          var cards = app.querySelectorAll(".card");
          if(cards[3]) cards[3].scrollIntoView({behavior:"smooth", block:"start"});
        }, 50);
        break;
      case "mode":
        landing.mode = t.getAttribute("data-mode");
        renderLanding();
        break;
      case "start":
        var sk = t.getAttribute("data-subject"), v = t.getAttribute("data-version");
        startQuiz({ subjectKey:sk, version:v, mode:landing.mode, source:"full",
                    questions:window.QBANK[sk].versions[v] });
        break;
      case "reset-scores":
        if(window.confirm("Clear your recent scores? (Weak-concept tracking stays.)")){
          resetScores(); renderLanding();
        }
        break;
      case "opt":
        selectOption(parseInt(t.getAttribute("data-i"),10));
        break;
      case "check": checkAnswer(); break;
      case "next": nextQuestion(); break;
      case "prev": prevQuestion(); break;
      case "quit-quiz":
        if(window.confirm("Exit this test? Progress on this attempt will be lost.")){
          renderLanding();
        }
        break;
      case "toggle-review":
        var item = t.closest(".review-item");
        if(item){ item.classList.toggle("open");
          var chev = item.querySelector(".chev"); if(chev) chev.textContent = item.classList.contains("open")?"▴":"▾";
        }
        break;
      case "practice-similar": practiceSimilar(); break;
      case "retry-missed": retryMissed(); break;
      case "retake": retake(); break;
      case "choose-version": chooseVersion(); break;
      case "home": renderLanding(); break;
      case "calc-open": openCalc(); break;
      case "calc-close": closeCalc(); break;
      case "tutor-ask": askTutorAbout(parseInt(t.getAttribute("data-idx"),10)); break;
    }
  }

  document.addEventListener("click", onTap);
  if(backdrop){ backdrop.addEventListener("click", closeCalc); }

  // Guard: make sure data loaded
  function boot(){
    if(!window.QBANK){
      app.innerHTML = '<div class="card"><p>Question data failed to load. Please refresh.</p></div>';
      return;
    }
    renderLanding();
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else { boot(); }

})();
</script>
<script type="module">
/* ============================================================
   AI Study Tutor - chat with Claude, straight from the browser.
   The student pastes their own Anthropic API key; it is kept in
   this browser's localStorage and sent only to api.anthropic.com.
   ============================================================ */
const MODEL = "claude-opus-5-5";
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.129.0/+esm";
const KEY_STORE = "nur243_tutor_key_v1";
const HIST_STORE = "nur243_tutor_history_v1";
const LONG_CHAT = 40; // suggest a fresh chat after this many messages

const SYSTEM_PROMPT = `You are a warm, encouraging nursing school tutor. Your student is in NUR 243 (adult medical-surgical nursing, respiratory unit: pneumonia, tuberculosis, asthma, and COPD; Lewis Medical-Surgical Nursing ch. 30-31) and is preparing for unit exams and the NCLEX-RN. They may also ask about other nursing topics - help with those too.

How to teach:
- Build understanding, not memorization: start from the pathophysiology, then connect it to assessment findings, priority nursing interventions, medications, and patient teaching.
- When prioritizing, name the NCLEX framework you're using (ABCs, Maslow, nursing process/ADPIE, safety, acute vs. chronic, actual vs. potential problems).
- When the student shares a practice question they have already answered, explain why the correct answer is right, why each distractor is wrong, and the test-taking strategy that gets there.
- When the student shares a question they have not answered yet, give a hint or a guiding question first rather than the answer, unless they ask for the answer directly.
- Offer a short mnemonic when one genuinely helps, and when it fits, end with one quick check-your-understanding question.
- When asked to quiz them, write NCLEX-style questions (including select-all-that-apply) one at a time and wait for their answer before revealing the answer and rationale.
- Use generic drug names, standard adult reference ranges, and note when values vary by facility or textbook. If you are not confident about something, say so and suggest checking the textbook or instructor.

Format: the student reads on a phone. Keep replies focused - short paragraphs, bullet lists, and **bold** key terms; no tables. Aim for under about 250 words unless they ask for more depth.

This is for studying only. If the student describes a real patient or clinical situation, help them think it through as a learning exercise but remind them to follow their instructor, preceptor, and facility policy for actual care decisions.`;

const CHIPS = [
  "Explain V/Q mismatch simply",
  "Quiz me on COPD, one question at a time",
  "Asthma meds: rescue vs. controller",
  "TB precautions and teaching",
  "How do I approach SATA questions?",
  "Priority assessments for pneumonia",
];

/* ---------- storage (fails soft in private mode) ---------- */
function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function store(k, v){
  try { if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){}
}
let history = [];
try { history = JSON.parse(load(HIST_STORE) || "[]"); } catch(e){ history = []; }
if(!Array.isArray(history)) history = [];
function saveHistory(){ store(HIST_STORE, JSON.stringify(history)); }

/* ---------- SDK (loaded on first use) ---------- */
let SDK = null;
let client = null, clientKey = null;
async function getClient(key){
  if(!SDK){ SDK = (await import(SDK_URL)).default; }
  if(!client || clientKey !== key){
    client = new SDK({ apiKey: key, dangerouslyAllowBrowser: true });
    clientKey = key;
  }
  return client;
}

/* ---------- rendering helpers ---------- */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function inline(s){ // s is already escaped
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
}
// Small, safe markdown subset: paragraphs, headings, bullet/numbered lists, bold/italic/code.
function renderMarkdown(src){
  let html = "", list = null, para = [];
  const flushPara = () => { if(para.length){ html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; } };
  const closeList = () => { if(list){ html += "</" + list + ">"; list = null; } };
  for(const raw of esc(src).split("\n")){
    const line = raw.trimEnd();
    let m;
    if(!line.trim()){ flushPara(); closeList(); continue; }
    if((m = /^#{1,6}\s+(.*)$/.exec(line))){ flushPara(); closeList(); html += "<h4>" + inline(m[1]) + "</h4>"; continue; }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ flushPara(); closeList(); html += "<hr>"; continue; }
    if((m = /^\s*[-*•]\s+(.*)$/.exec(line))){
      flushPara(); if(list !== "ul"){ closeList(); html += "<ul>"; list = "ul"; }
      html += "<li>" + inline(m[1]) + "</li>"; continue;
    }
    if((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))){
      flushPara(); if(list !== "ol"){ closeList(); html += "<ol>"; list = "ol"; }
      html += "<li>" + inline(m[1]) + "</li>"; continue;
    }
    closeList(); para.push(line);
  }
  flushPara(); closeList();
  return html;
}
function textOf(content){
  if(typeof content === "string") return content;
  return content.filter(b => b.type === "text").map(b => b.text).join("");
}

document.body.append(fab, shade, panel);

const logEl = panel.querySelector("#tutor-log");

let busy = false;
let activeStream = null;
let pending = null; // message waiting for a key to be saved

function scrollDown(){ logEl.scrollTop = logEl.scrollHeight; }

function renderLog(){
  let html = "";
  if(!history.length){
    html += '<div class="tmsg bot">' + renderMarkdown(
      "Hi! I'm your study tutor. Ask me to **explain a concept**, **walk through a practice question**, " +
      "or **quiz you**. Tap a suggestion below to get started.\n\n" +
      "Tip: after you check an answer in Study mode, tap **Ask the tutor about this** to go over that question with me."
    ) + '</div>';
  }
  for(const m of history){
    if(m.role === "user"){
      html += '<div class="tmsg user">'
            + (m.label ? '<span class="ctx">📋 ' + esc(m.label.length > 110 ? m.label.slice(0,107) + "…" : m.label) + '</span>' + '(question details sent to the tutor)'
                       : esc(m.content))
            + '</div>';
    } else {
      html += '<div class="tmsg bot">' + renderMarkdown(textOf(m.content)) + '</div>';
    }
  }
  if(history.length >= LONG_CHAT){
    html += '<div class="tmsg note">This chat is getting long. Tap <b>New chat</b> when you switch topics.</div>';
  }
  logEl.innerHTML = html;
  scrollDown();
}

function addBubble(cls, html){
  const el = document.createElement("div");
  el.className = "tmsg " + cls;
  el.innerHTML = html;
  logEl.appendChild(el);
  scrollDown();
  return el;
}

function setBusy(on){
  busy = on;
  sendBtn.textContent = on ? "Stop" : "Send";
  sendBtn.classList.toggle("stop", on);
}

function openPanel(){
  shade.classList.add("open");
  panel.classList.add("open");
  renderLog();
  if(!load(KEY_STORE)) showSettings("Add your Claude API key to start chatting.");
}
function closePanel(){
  shade.classList.remove("open");
  panel.classList.remove("open");
  inputEl.blur();
}
function showSettings(msg){
  settingsEl.hidden = false;
  settingsMsg.hidden = !msg;
  settingsMsg.textContent = msg || "";
  keyEl.value = load(KEY_STORE) || "";
}
function hideSettings(){ settingsEl.hidden = true; }

function autosize(){
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + "px";
}

function explainError(err){
  if(SDK && err instanceof SDK.AuthenticationError) return "That API key was rejected. Check it in ⚙️ settings.";
  if(SDK && err instanceof SDK.PermissionDeniedError) return "This API key doesn't have permission to use the tutor model.";
  if(SDK && err instanceof SDK.RateLimitError) return "Too many requests right now. Wait a moment and try again.";
  if(SDK && err instanceof SDK.APIConnectionError) return "Couldn't reach Claude. Check your internet connection and try again.";
  if(SDK && err instanceof SDK.APIError){
    if(err.status >= 500) return "Claude is busy or having trouble right now. Please try again in a minute.";
    return "Claude returned an error: " + (err.error?.error?.message || err.message);
  }
  if(!SDK) return "Couldn't load the tutor. Check your internet connection and try again.";
  return "Something went wrong: " + (err && err.message ? err.message : err);
}

async function send(text, label){
  text = (text || "").trim();
  if(!text || busy) return;
  const key = load(KEY_STORE);
  if(!key){
    pending = { text, label };
    showSettings("Add your Claude API key to start chatting.");
    return;
  }
  hideSettings();

  history.push(label ? { role: "user", content: text, label } : { role: "user", content: text });
  renderLog();
  const bubble = addBubble("bot", '<span class="typing"><span></span><span></span><span></span></span>');
  setBusy(true);

  let shown = "";
  try {
    const c = await getClient(key);
    activeStream = c.beta.messages.stream({
      model: MODEL,
      max_tokens: 64000,
      thinking: { type: "adaptive" },
      output_config: { effort: "medium" },
      // Medical topics can occasionally trip a safety classifier; let the API
      // retry on its recommended fallback model instead of refusing outright.
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      system: SYSTEM_PROMPT,
      messages: history.map(m => ({ role: m.role, content: m.content })),
    });
    activeStream.on("text", (delta) => {
      shown += delta;
      bubble.innerHTML = renderMarkdown(shown);
      scrollDown();
    });
    const msg = await activeStream.finalMessage();
    if(msg.stop_reason === "refusal"){
      history.pop();
      renderLog();
      addBubble("err", "The tutor couldn't answer that one. Try rephrasing it as a study question.");
    } else {
      // Keep the full content (including thinking blocks) so the conversation stays valid.
      history.push({ role: "assistant", content: msg.content });
      saveHistory();
      renderLog();
      if(msg.stop_reason === "max_tokens") addBubble("note", "(Reply was cut off. Ask me to continue.)");
    }
  } catch(err){
    history.pop();
    renderLog();
    if(SDK && err instanceof SDK.APIUserAbortError){
      addBubble("note", "Stopped.");
    } else {
      addBubble("err", esc(explainError(err)));
      if(SDK && err instanceof SDK.AuthenticationError) showSettings("That key didn't work. Paste a valid key.");
    }
    if(!label && !inputEl.value){ inputEl.value = text; autosize(); }
  } finally {
    activeStream = null;
    setBusy(false);
  }
}

/* ---------- events ---------- */
fab.addEventListener("click", openPanel);
shade.addEventListener("click", closePanel);

panel.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tact]");
  if(!t) return;
  switch(t.getAttribute("data-tact")){
    case "close": closePanel(); break;
    case "settings":
      if(settingsEl.hidden) showSettings(); else hideSettings();
      break;
    case "clear":
      if(busy && activeStream) activeStream.abort();
      if(!history.length || window.confirm("Start a new chat? This conversation will be cleared.")){
        history = []; saveHistory(); renderLog();
      }
      break;
    case "save-key": {
      const k = keyEl.value.trim();
      if(!k){ showSettings("Paste your API key first."); return; }
      store(KEY_STORE, k);
      hideSettings();
      if(pending){ const p = pending; pending = null; send(p.text, p.label); }
      else addBubble("note", "Key saved. Ask away!");
      break;
    }
    case "remove-key":
      store(KEY_STORE, null); keyEl.value = ""; client = null;
      showSettings("Key removed from this browser.");
      break;
    case "chip":
      send(t.textContent);
      break;
  }
});

panel.querySelector("#tutor-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if(busy){ if(activeStream) activeStream.abort(); return; }
  const text = inputEl.value;
  inputEl.value = ""; autosize();
  send(text);
});
inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", (e) => {
  // Enter sends on a keyboard; on phones Enter adds a new line and the Send button sends.
  if(e.key === "Enter" && !e.shiftKey && !window.matchMedia("(pointer:coarse)").matches){
    e.preventDefault();
    panel.querySelector("#tutor-form").requestSubmit();
  }
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && panel.classList.contains("open")) closePanel();
});

/* ---------- used by the quiz ("Ask the tutor about this") ---------- */
window.NURTutor = {
  ask(text, label){
    openPanel();
    send(text, label);
  },
};
</script>
</body></html>
